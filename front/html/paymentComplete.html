<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Shoot</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/front/css/paymentComplete.css" rel="stylesheet">
</head>
<body>
    <div class="payment-complete">
        <div class="complete-card">
            <div class="complete-text">
                <div class="complete-title">숙소 예약이 완료되었습니다.</div>
                <div class="complete-subtitle">Travel Shoot에서 끊김 없는 여행을 경험해보세요.</div>
            </div>
            
            <div class="payment-complete-btn">
                <button class="btn1">예약 상세 조회</button>
                <button class="btn2">홈으로</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        // 버튼 클릭 이벤트
        document.querySelector('.btn-primary-custom').addEventListener('click', function(e) {
            e.preventDefault();
        });

        document.querySelector('.btn-secondary-custom').addEventListener('click', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
