<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>후기 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../css/common.css" rel="stylesheet" />
    <link href="../css/review-regist.css" rel="stylesheet"/>
</head>
<body>
    <div class="review-write-page">
        <!-- 헤더 -->
        <header class="page-header">
            <div class="header-container">
                <button class="back-button" type="button">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <div class="page-title">후기 작성</div>
                <button class="home-button" type="button">
                    <i class="fas fa-home"></i>
                </button>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="main-content py-5">
            <!-- 숙소 정보 -->
            <section class="accommodation-info-section">
                <div class="reservation-number">
                    <span class="reservation-value">숙소 예약번호: 250603002946000110</span>

                    <div class="accommodation-card">
                        <div class="accommodation-image-wrapper">
                            <img src="../img/main-example.svg" 
                                alt="부산 더스카이" 
                                class="accommodation-image">
                        </div>
                    
                        <div class="accommodation-details">
                            <div class="accommodation-header">
                                <h2 class="accommodation-name">부산 더스카이</h2>
                                <span class="status-badge">이용완료</span>
                            </div>
                            
                            <div class="booking-details">
                                <div class="booking-item">
                                    <i class="fas fa-calendar-alt booking-icon calendar-icon"></i>
                                    <span class="booking-text">2025.04.21 ~ 04.22 (1박)</span>
                                </div>
                                <div class="booking-item">
                                    <i class="fas fa-users booking-icon users-icon"></i>
                                    <span class="booking-text">성인 2명 · 객실 1개</span>
                                </div>
                                <div class="booking-item">
                                    <i class="fas fa-clock booking-icon clock-icon"></i>
                                    <span class="booking-text">체크인 15:00 | 체크아웃 11:00</span>
                                </div>
                            </div>
                        </div>
                    </div>


                </div>
            </section>

            <!-- 평점 섹션 (전체 + 세부 통합) -->
            <section class="rating-section">
                <!-- 전체 만족도 -->
                <div class="overall-rating">
                    <div class="rating-question">부산 더스카이 이용에 만족하셨나요?</div>
                    <div class="star-rating-container" data-category="overall">
                        <button class="star-button" data-rating="1" type="button">
                            ★
                        </button>
                        <button class="star-button" data-rating="2" type="button">
                            ★
                        </button>
                        <button class="star-button" data-rating="3" type="button">
                            ★
                        </button>
                        <button class="star-button" data-rating="4" type="button">
                            ★
                        </button>
                        <button class="star-button" data-rating="5" type="button">
                            ★
                        </button>
                    </div>
                </div>

                <!-- 세부 평점 -->
                <div class="detailed-rating">
                    <div class="rating-categories">
                        <!-- 청결도 -->
                        <div class="rating-category">
                            <div class="category-label">청결도</div>
                            <div class="star-rating-container" data-category="cleanliness">
                                <button class="star-button" data-rating="1" type="button">★</button>
                                <button class="star-button" data-rating="2" type="button">★</button>
                                <button class="star-button" data-rating="3" type="button">★</button>
                                <button class="star-button" data-rating="4" type="button">★</button>
                                <button class="star-button" data-rating="5" type="button">★</button>
                            </div>
                        </div>

                        <!-- 편의성 -->
                        <div class="rating-category">
                            <div class="category-label">편의성</div>
                            <div class="star-rating-container" data-category="convenience">
                                <button class="star-button" data-rating="1" type="button">★</button>
                                <button class="star-button" data-rating="2" type="button">★</button>
                                <button class="star-button" data-rating="3" type="button">★</button>
                                <button class="star-button" data-rating="4" type="button">★</button>
                                <button class="star-button" data-rating="5" type="button">★</button>
                            </div>
                        </div>

                        <!-- 체크인 -->
                        <div class="rating-category">
                            <div class="category-label">체크인</div>
                            <div class="star-rating-container" data-category="checkin">
                                <button class="star-button" data-rating="1" type="button">★</button>
                                <button class="star-button" data-rating="2" type="button">★</button>
                                <button class="star-button" data-rating="3" type="button">★</button>
                                <button class="star-button" data-rating="4" type="button">★</button>
                                <button class="star-button" data-rating="5" type="button">★</button>
                            </div>
                        </div>

                        <!-- 의사소통 -->
                        <div class="rating-category">
                            <div class="category-label">의사소통</div>
                            <div class="star-rating-container" data-category="communication">
                                <button class="star-button" data-rating="1" type="button">★</button>
                                <button class="star-button" data-rating="2" type="button">★</button>
                                <button class="star-button" data-rating="3" type="button">★</button>
                                <button class="star-button" data-rating="4" type="button">★</button>
                                <button class="star-button" data-rating="5" type="button">★</button>
                            </div>
                        </div>

                        <!-- 위치 -->
                        <div class="rating-category">
                            <div class="category-label">위치</div>
                            <div class="star-rating-container" data-category="location">
                                <button class="star-button" data-rating="1" type="button">★</button>
                                <button class="star-button" data-rating="2" type="button">★</button>
                                <button class="star-button" data-rating="3" type="button">★</button>
                                <button class="star-button" data-rating="4" type="button">★</button>
                                <button class="star-button" data-rating="5" type="button">★</button>
                            </div>
                        </div>

                        <!-- 가성비 -->
                        <div class="rating-category">
                            <div class="category-label">가성비</div>
                            <div class="star-rating-container" data-category="value">
                                <button class="star-button" data-rating="1" type="button">★</button>
                                <button class="star-button" data-rating="2" type="button">★</button>
                                <button class="star-button" data-rating="3" type="button">★</button>
                                <button class="star-button" data-rating="4" type="button">★</button>
                                <button class="star-button" data-rating="5" type="button">★</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 텍스트 후기 -->
            <section class="text-review-section">
                <h3 class="section-title">텍스트 후기 작성 (선택)</h3>
                <textarea class="review-textarea" 
                          placeholder="이용한 경험을 자세히 알려주세요." 
                          rows="4"></textarea>
            </section>

            <!-- 사진 업로드 -->
            <section class="photo-upload-section">
                <h3 class="section-title">사진 업로드 (선택)</h3>
                
                <input type="file" id="photo-input" class="photo-input" accept="image/*">
                
                <div class="upload-area" id="upload-area">
                    <div class="upload-content">
                        <i class="fas fa-cloud-upload-alt upload-icon"></i>
                        <div class="upload-text">사진을 여기에 드래그하거나</div>
                        <div class="upload-subtext">JPG, PNG 파일 (최대 10MB)</div>
                        <button type="button" class="upload-browse-button" id="browse-button">
                            <i class="fas fa-folder-open"></i>파일 선택
                        </button>
                        <div class="upload-hint">또는 클릭하여 파일을 선택하세요</div>
                    </div>
                </div>

                <div class="photo-preview" id="photo-preview">
                    <img class="preview-image" id="preview-image" alt="미리보기">
                    <button type="button" class="remove-photo-button" id="remove-photo">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="upload-success-message">
                        <i class="fas fa-check-circle"></i>사진이 업로드되었습니다
                    </div>
                </div>
            </section>

            <!-- 추천 여부 -->
            <section class="recommendation-section">
                <div class="recommendation-question">이 숙소를 다른 사람에게 추천하시겠습니까?</div>
                <button class="recommendation-button" id="recommendation-button" type="button">
                    <i class="fas fa-heart"></i>네, 추천합니다.
                </button>
            </section>

            <!-- 액션 버튼 -->
            <section class="action-buttons-section">
                <div class="button-group">
                    <button class="cancel-button" type="button">취소</button>
                    <button class="submit-button" id="submit-button" type="button">등록</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 평점 관리 객체
        const ratings = {};
        let recommendationSelected = false;
        let uploadedFile = null;
        let isUpdatingFromOverall = false;

        // 카테고리 목록
        const detailCategories = ['cleanliness', 'convenience', 'checkin', 'communication', 'location', 'value'];

        // 전체 평점 평균 계산
        function calculateOverallAverage() {
            const validRatings = detailCategories
                .map(category => ratings[category])
                .filter(rating => rating > 0);
            
            if (validRatings.length === 0) return 0;
            
            const sum = validRatings.reduce((acc, rating) => acc + rating, 0);
            return Math.round(sum / validRatings.length);
        }

        // 별점 시각적 업데이트
        function updateStarVisuals(category, rating) {
            const container = document.querySelector(`[data-category="${category}"]`);
            const stars = container.querySelectorAll('.star-button');
            
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // 전체 평점에서 세부 평점 업데이트
        function updateDetailFromOverall(overallRating) {
            isUpdatingFromOverall = true;
            
            detailCategories.forEach(category => {
                ratings[category] = overallRating;
                updateStarVisuals(category, overallRating);
            });
            
            isUpdatingFromOverall = false;
        }

        // 세부 평점에서 전체 평점 업데이트
        function updateOverallFromDetails() {
            if (isUpdatingFromOverall) return;
            
            const averageRating = calculateOverallAverage();
            
            if (averageRating > 0) {
                ratings['overall'] = averageRating;
                updateStarVisuals('overall', averageRating);
            }
        }

        // 별점 이벤트 리스너 설정
        document.querySelectorAll('.star-rating-container').forEach(container => {
            const category = container.dataset.category;
            const stars = container.querySelectorAll('.star-button');
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.dataset.rating);
                    ratings[category] = rating;
                    
                    updateStarVisuals(category, rating);
                    
                    if (category === 'overall') {
                        updateDetailFromOverall(rating);
                    } else {
                        updateOverallFromDetails();
                    }
                    
                    updateSubmitButton();
                });
            });
        });

        // 추천 버튼 이벤트
        document.getElementById('recommendation-button').addEventListener('click', function() {
            recommendationSelected = !recommendationSelected;
            this.classList.toggle('active');
            updateSubmitButton();
        });

        // 파일 업로드 관련
        const photoInput = document.getElementById('photo-input');
        const uploadArea = document.getElementById('upload-area');
        const browseButton = document.getElementById('browse-button');
        const photoPreview = document.getElementById('photo-preview');
        const previewImage = document.getElementById('preview-image');
        const removePhoto = document.getElementById('remove-photo');

        // browseButton.addEventListener('click', () => photoInput.click());
        uploadArea.addEventListener('click', () => !uploadedFile && photoInput.click());

        photoInput.addEventListener('change', handleFileSelect);

        // 드래그 앤 드롭
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    handleFile(file);
                } else {
                    alert('이미지 파일만 업로드 가능합니다.');
                }
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) handleFile(file);
        }

        function handleFile(file) {
            if (file.size > 10 * 1024 * 1024) {
                alert('파일 크기는 10MB 이하만 가능합니다.');
                return;
            }

            uploadedFile = file;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                uploadArea.style.display = 'none';
                photoPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        removePhoto.addEventListener('click', () => {
            uploadedFile = null;
            photoInput.value = '';
            previewImage.src = '';
            uploadArea.style.display = 'flex';
            photoPreview.style.display = 'none';
        });

        // 제출 버튼 상태 업데이트
        function updateSubmitButton() {
            const submitBtn = document.getElementById('submit-button');
            const allCategories = ['overall', ...detailCategories];
            const allRated = allCategories.every(category => ratings[category] > 0);
            
            submitBtn.disabled = !allRated;
            if (allRated) {
                submitBtn.classList.add('active');
            } else {
                submitBtn.classList.remove('active');
            }
        }

        // 초기 상태 설정
        updateSubmitButton();
    </script>
</body>
</html>
