spring.application.name=backend
server.address=0.0.0.0
server.port=8080

spring.data.redis.host=redis
spring.data.redis.port=6379

spring.profiles.include=email,openai,s3,kakaopay

# jpa show sql query
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ?? ???? null ??
spring.jackson.default-property-inclusion: non_null

# Gmail email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# file config: to save big size file
spring.servlet.multipart.enabled: true
spring.servlet.multipart.max-file-size: 100MB
spring.servlet.multipart.max-request-size: 200MB

#kakao-pay
kakao.pay.secret-key=${KAKAO_SECRET_KEY}
kakao.pay.cid=${KAKAO_PAY_CID}

# kakao-pay redirect base URL - local
kakao.pay.redirect-base-url=http://localhost:3000

# TODO : localhost
server.servlet.session.cookie.same-site=lax
# session cookie (HTTP)
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m

