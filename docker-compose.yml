version: "3.8"

services:
  mysql-db:
    build:
      context: ./mysql
    container_name: mysql8-container
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: travel_shoot
      MYSQL_USER: kcc
      MYSQL_PASSWORD: kcc
      TZ: Asia/Seoul
    command: --lower_case_table_names=1 --default-time-zone='+09:00'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./mysql/migrations/2025101010_01_add_search_history_table.sql:/docker-entrypoint-initdb.d/2025101010_01_add_search_history_table.sql
      - ./mysql/migrations/2025101013_01_drop_travel_courses_course_data_column.sql:/docker-entrypoint-initdb.d/2025101013_01_drop_travel_courses_course_data_column.sql
      - ./mysql/migrations/2025101013_02_create_course_spots_table.sql:/docker-entrypoint-initdb.d/2025101013_02_create_course_spots_table.sql
      - ./mysql/migrations/2025101013_03_change_user_survey_foods_category_to_enum.sql:/docker-entrypoint-initdb.d/2025101013_03_change_user_survey_foods_category_to_enum.sql
      - ./mysql/migrations/2025101013_04_change_user_survey_activities_category_to_enum.sql:/docker-entrypoint-initdb.d/2025101013_04_change_user_survey_activities_category_to_enum.sql
      - ./mysql/migrations/2025101013_05_drop_travel_courses_transportation_method.sql:/docker-entrypoint-initdb.d/2025101013_05_drop_travel_courses_transportation_method.sql
      - ./mysql/migrations/2025101013_06_add_reservations_transportation_method.sql:/docker-entrypoint-initdb.d/2025101013_06_add_reservations_transportation_method.sql
      - ./mysql/migrations/2025101013_07_add_view_history_table.sql:/docker-entrypoint-initdb.d/2025101013_07_add_view_history_table.sql
      - ./mysql/migrations/2025101013_08_drop_user_preferences.sql:/docker-entrypoint-initdb.d/2025101013_08_drop_user_preferences.sql
      - ./mysql/migrations/2025101013_09_add_viewCount_column.sql:/docker-entrypoint-initdb.d/2025101013_09_add_viewCount_column.sql
      - ./mysql/migrations/2025101015_01_drop_travel_courses_stay_id_column.sql:/docker-entrypoint-initdb.d/2025101015_01_drop_travel_courses_stay_id_column.sql
      - ./mysql/migrations/2025101023_01_change_stays_check_in_out_column.sql:/docker-entrypoint-initdb.d/2025101023_01_change_stays_check_in_out_column.sql
      - ./mysql/migrations/2025101023_02_add_review_summaries_review_count_column.sql:/docker-entrypoint-initdb.d/2025101023_02_add_review_summaries_review_count_column.sql
      - ./mysql/migrations/2025101024_01_change_rooms_check_in_out_time_column.sql:/docker-entrypoint-initdb.d/2025101024_01_change_rooms_check_in_out_time_column.sql
    networks:
      - backendnet
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pmysql",
        ]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backendnet

  # === Spring Boot Backend ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: spring-backend
    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev #TODO : 테스트 계정 생성 때문에 추가
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/travel_shoot?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: kcc
      SPRING_DATASOURCE_PASSWORD: kcc
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    volumes:
      - ./backend/src:/app/src
    networks:
      - backendnet
      - webnet

  # === React Frontend ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: react-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Force file change detection
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - webnet

  # === NGINX Proxy ===
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    networks:
      - webnet
networks:
  webnet:
    driver: bridge
  backendnet:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
